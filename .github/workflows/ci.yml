name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend into embed dir
        run: |
          cd web && npm ci && npm run build
          cd .. && rm -rf internal/webui/dist/* && cp -R web/dist/* internal/webui/dist/

      - name: Go vet & test
        run: |
          go vet ./...
          go test ./...

      - name: Build backend & smoke
        run: |
          go build -trimpath -ldflags "-s -w" -o /tmp/keeper ./cmd/server
          /tmp/keeper -version
